name: Build mod
on: [push, workflow_dispatch]
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.5
      - name: Criar codigo do mod e compilar
        run: |
          set -e
          mkdir -p mod && cd mod
          cat > settings.gradle <<'VHSEOF'
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  maven { url = 'https://maven.minecraftforge.net/' }
              }
          }
          plugins { id 'org.gradle.toolchains.foojay-resolver-convention' version '0.7.0' }
          rootProject.name = 'vhscam'
          VHSEOF
          cat > gradle.properties <<'VHSEOF'
          org.gradle.jvmargs=-Xmx3G
          org.gradle.daemon=false
          VHSEOF
          cat > build.gradle <<'VHSEOF'
          plugins {
              id 'java'
              id 'net.minecraftforge.gradle' version '[6.0.16,6.2)'
          }

          version = '1.1.0'
          group = 'dev.vhscam'
          base { archivesName = 'vhscam-forge-1.20.1' }

          java.toolchain.languageVersion = JavaLanguageVersion.of(17)

          minecraft {
              mappings channel: 'official', version: '1.20.1'
              runs {
                  client {
                      workingDirectory project.file('run')
                      property 'forge.logging.console.level', 'debug'
                      mods { vhscam { source sourceSets.main } }
                  }
              }
          }

          repositories {}

          dependencies {
              minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
          }

          tasks.named('processResources', ProcessResources).configure {
              var props = [version: project.version]
              inputs.properties props
              filesMatching('META-INF/mods.toml') { expand props }
          }

          tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
          VHSEOF
          mkdir -p src/main/resources/META-INF
          cat > src/main/resources/META-INF/mods.toml <<'VHSEOF'
          modLoader="javafml"
          loaderVersion="[47,)"
          license="MIT"

          [[mods]]
          modId="vhscam"
          version="${version}"
          displayName="VHS Viewfinder"
          description='''Camera VHS found footage: item de camcorder, viewfinder 4:3, fita, timecode, zoom e movimento de camera na mao.'''

          [[dependencies.vhscam]]
          modId="forge"
          mandatory=true
          versionRange="[47,)"
          ordering="NONE"
          side="BOTH"

          [[dependencies.vhscam]]
          modId="minecraft"
          mandatory=true
          versionRange="[1.20.1,1.21)"
          ordering="NONE"
          side="BOTH"
          VHSEOF
          mkdir -p src/main/resources
          cat > src/main/resources/pack.mcmeta <<'VHSEOF'
          { "pack": { "description": "VHS Viewfinder resources", "pack_format": 15 } }
          VHSEOF
          mkdir -p src/main/resources/assets/vhscam/lang
          cat > src/main/resources/assets/vhscam/lang/en_us.json <<'VHSEOF'
          {
            "item.vhscam.camcorder": "Camcorder",
            "key.category.vhscam": "VHS Viewfinder",
            "key.vhscam.toggle": "Raise / lower camcorder",
            "key.vhscam.rec": "Record / standby",
            "key.vhscam.zoom_in": "Zoom in",
            "key.vhscam.zoom_out": "Zoom out",
            "key.vhscam.tape": "Change tape (A-D)",
            "key.vhscam.speed": "Tape speed SP / LP"
          }
          VHSEOF
          mkdir -p src/main/resources/assets/vhscam/lang
          cat > src/main/resources/assets/vhscam/lang/pt_br.json <<'VHSEOF'
          {
            "item.vhscam.camcorder": "Câmera VHS",
            "key.category.vhscam": "VHS Viewfinder",
            "key.vhscam.toggle": "Levantar / abaixar câmera",
            "key.vhscam.rec": "Gravar / standby",
            "key.vhscam.zoom_in": "Aproximar zoom",
            "key.vhscam.zoom_out": "Afastar zoom",
            "key.vhscam.tape": "Trocar fita (A-D)",
            "key.vhscam.speed": "Velocidade SP / LP"
          }
          VHSEOF
          mkdir -p src/main/resources/assets/vhscam/models/item
          cat > src/main/resources/assets/vhscam/models/item/camcorder.json <<'VHSEOF'
          { "parent": "item/generated", "textures": { "layer0": "vhscam:item/camcorder" } }
          VHSEOF
          mkdir -p src/main/resources/data/vhscam/recipes
          cat > src/main/resources/data/vhscam/recipes/camcorder.json <<'VHSEOF'
          {
            "type": "minecraft:crafting_shaped",
            "pattern": ["III", "IGR", "III"],
            "key": {
              "I": { "item": "minecraft:iron_ingot" },
              "G": { "item": "minecraft:glass_pane" },
              "R": { "item": "minecraft:redstone" }
            },
            "result": { "item": "vhscam:camcorder" }
          }
          VHSEOF
          mkdir -p src/main/java/dev/vhscam
          cat > src/main/java/dev/vhscam/VhsCam.java <<'VHSEOF'
          package dev.vhscam;

          import net.minecraft.world.item.CreativeModeTabs;
          import net.minecraft.world.item.Item;
          import net.minecraftforge.event.BuildCreativeModeTabContentsEvent;
          import net.minecraftforge.eventbus.api.IEventBus;
          import net.minecraftforge.fml.common.Mod;
          import net.minecraftforge.fml.javafmlmod.FMLJavaModLoadingContext;
          import net.minecraftforge.registries.DeferredRegister;
          import net.minecraftforge.registries.ForgeRegistries;
          import net.minecraftforge.registries.RegistryObject;

          @Mod(VhsCam.MODID)
          public class VhsCam {
              public static final String MODID = "vhscam";

              public static final DeferredRegister<Item> ITEMS = DeferredRegister.create(ForgeRegistries.ITEMS, MODID);
              public static final RegistryObject<Item> CAMCORDER =
                  ITEMS.register("camcorder", () -> new Item(new Item.Properties().stacksTo(1)));

              public VhsCam() {
                  IEventBus bus = FMLJavaModLoadingContext.get().getModEventBus();
                  ITEMS.register(bus);
                  bus.addListener(this::addCreative);
              }

              private void addCreative(BuildCreativeModeTabContentsEvent e) {
                  if (e.getTabKey() == CreativeModeTabs.TOOLS_AND_UTILITIES) e.accept(CAMCORDER);
              }
          }
          VHSEOF
          mkdir -p src/main/java/dev/vhscam
          cat > src/main/java/dev/vhscam/CamState.java <<'VHSEOF'
          package dev.vhscam;

          public class CamState {
              public static boolean active = false;
              public static boolean recording = false;
              public static boolean longPlay = false;
              public static long recStartMs = 0;
              public static long recAccumMs = 0;
              public static char tape = 'A';
              public static float zoom = 1.0f;
              public static float targetZoom = 1.0f;
              public static final float MAX_ZOOM = 8.0f;

              // movimento da camera
              public static float jolt = 0f;
              public static double lagYaw = 0, lagPitch = 0;
              public static boolean lagInit = false;
              public static long lastNs = 0;

              public static void raise() {
                  active = true;
                  lagInit = false;
              }

              public static void lower() {
                  pause();
                  active = false;
                  zoom = 1.0f;
                  targetZoom = 1.0f;
              }

              public static void pause() {
                  if (recording) recAccumMs += System.currentTimeMillis() - recStartMs;
                  recording = false;
              }

              public static void toggleRec() {
                  if (recording) pause();
                  else { recording = true; recStartMs = System.currentTimeMillis(); }
              }

              public static long elapsedMs() {
                  return recAccumMs + (recording ? System.currentTimeMillis() - recStartMs : 0);
              }
          }
          VHSEOF
          mkdir -p src/main/java/dev/vhscam
          cat > src/main/java/dev/vhscam/ClientEvents.java <<'VHSEOF'
          package dev.vhscam;

          import net.minecraft.client.KeyMapping;
          import net.minecraft.client.Minecraft;
          import net.minecraft.util.Mth;
          import net.minecraft.world.entity.player.Player;
          import net.minecraft.world.item.Item;
          import net.minecraft.world.phys.Vec3;
          import net.minecraftforge.api.distmarker.Dist;
          import net.minecraftforge.client.event.InputEvent;
          import net.minecraftforge.client.event.RegisterKeyMappingsEvent;
          import net.minecraftforge.client.event.RenderGuiEvent;
          import net.minecraftforge.client.event.RenderHandEvent;
          import net.minecraftforge.client.event.ViewportEvent;
          import net.minecraftforge.event.TickEvent;
          import net.minecraftforge.eventbus.api.SubscribeEvent;
          import net.minecraftforge.fml.common.Mod;
          import org.lwjgl.glfw.GLFW;

          public class ClientEvents {
              public static final String CAT = "key.category.vhscam";
              public static final KeyMapping TOGGLE = new KeyMapping("key.vhscam.toggle", GLFW.GLFW_KEY_V, CAT);
              public static final KeyMapping REC    = new KeyMapping("key.vhscam.rec", GLFW.GLFW_KEY_R, CAT);
              public static final KeyMapping ZOOM_IN  = new KeyMapping("key.vhscam.zoom_in", GLFW.GLFW_KEY_UP, CAT);
              public static final KeyMapping ZOOM_OUT = new KeyMapping("key.vhscam.zoom_out", GLFW.GLFW_KEY_DOWN, CAT);
              public static final KeyMapping TAPE   = new KeyMapping("key.vhscam.tape", GLFW.GLFW_KEY_B, CAT);
              public static final KeyMapping SPEED  = new KeyMapping("key.vhscam.speed", GLFW.GLFW_KEY_N, CAT);

              static boolean holdingCamera(Player p) {
                  Item it = VhsCam.CAMCORDER.get();
                  return p.getMainHandItem().is(it) || p.getOffhandItem().is(it);
              }

              @Mod.EventBusSubscriber(modid = VhsCam.MODID, value = Dist.CLIENT, bus = Mod.EventBusSubscriber.Bus.MOD)
              public static class ModBus {
                  @SubscribeEvent
                  public static void onKeys(RegisterKeyMappingsEvent e) {
                      e.register(TOGGLE);
                      e.register(REC);
                      e.register(ZOOM_IN);
                      e.register(ZOOM_OUT);
                      e.register(TAPE);
                      e.register(SPEED);
                  }
              }

              @Mod.EventBusSubscriber(modid = VhsCam.MODID, value = Dist.CLIENT, bus = Mod.EventBusSubscriber.Bus.FORGE)
              public static class ForgeBus {
                  private static boolean prevSneak = false;
                  private static boolean wasGround = true;
                  private static double prevVy = 0;
                  private static long lastActionMs = 0;
                  private static final float[] ZOOM_STEPS = {1f, 2f, 4f, 8f};

                  @SubscribeEvent
                  public static void onTick(TickEvent.ClientTickEvent e) {
                      if (e.phase != TickEvent.Phase.END) return;
                      Minecraft mc = Minecraft.getInstance();
                      Player p = mc.player;
                      if (p == null) { CamState.lower(); return; }

                      boolean holding = holdingCamera(p);

                      // landing jolt
                      boolean g = p.isOnGround();
                      if (CamState.active && g && !wasGround && prevVy < -0.3) {
                          CamState.jolt = (float) Math.min(4.0, -prevVy * 4.0);
                      }
                      wasGround = g;
                      prevVy = p.getDeltaMovement().y;

                      // consome as teclas sempre (evita acumular cliques)
                      boolean tog = false, rec = false, tape = false, speed = false;
                      while (TOGGLE.consumeClick()) tog = true;
                      while (REC.consumeClick()) rec = true;
                      while (TAPE.consumeClick()) tape = true;
                      while (SPEED.consumeClick()) speed = true;

                      if (!holding) {
                          if (CamState.active) CamState.lower();
                          prevSneak = p.isShiftKeyDown();
                          return;
                      }

                      if (tog) { if (CamState.active) CamState.lower(); else CamState.raise(); }

                      // agachar abaixa a camera (util no toque)
                      boolean sneak = p.isShiftKeyDown();
                      if (CamState.active && sneak && !prevSneak) CamState.lower();
                      prevSneak = sneak;

                      if (CamState.active) {
                          if (rec) CamState.toggleRec();
                          if (tape && !CamState.recording) {
                              CamState.tape = (char) (CamState.tape >= 'D' ? 'A' : CamState.tape + 1);
                              CamState.recAccumMs = 0;
                          }
                          if (speed) CamState.longPlay = !CamState.longPlay;
                          if (ZOOM_IN.isDown())  CamState.targetZoom = Math.min(CamState.MAX_ZOOM, CamState.targetZoom + 0.06f);
                          if (ZOOM_OUT.isDown()) CamState.targetZoom = Math.max(1.0f, CamState.targetZoom - 0.06f);
                          CamState.zoom += (CamState.targetZoom - CamState.zoom) * 0.25f;
                      }
                  }

                  // Clique direito = erguer / gravar. Clique esquerdo (com a camera erguida) = zoom em passos.
                  @SubscribeEvent
                  public static void onClick(InputEvent.InteractionKeyMappingTriggered e) {
                      Minecraft mc = Minecraft.getInstance();
                      Player p = mc.player;
                      if (p == null || mc.screen != null || !holdingCamera(p)) return;

                      long now = System.currentTimeMillis();
                      if (e.isUseItem()) {
                          if (now - lastActionMs > 300) {
                              lastActionMs = now;
                              if (!CamState.active) CamState.raise();
                              else CamState.toggleRec();
                          }
                          e.setCanceled(true);
                          e.setSwingHand(false);
                      } else if (e.isAttack() && CamState.active) {
                          if (now - lastActionMs > 300) {
                              lastActionMs = now;
                              float cur = CamState.targetZoom;
                              float next = ZOOM_STEPS[0];
                              for (float z : ZOOM_STEPS) { if (z > cur + 0.1f) { next = z; break; } }
                              CamState.targetZoom = next;
                          }
                          e.setCanceled(true);
                          e.setSwingHand(false);
                      }
                  }

                  // Sem mao na tela: quem segura a camera e o personagem
                  @SubscribeEvent
                  public static void onHand(RenderHandEvent e) {
                      if (CamState.active) e.setCanceled(true);
                  }

                  @SubscribeEvent
                  public static void onGui(RenderGuiEvent.Pre e) {
                      if (!CamState.active) return;
                      VhsOverlay.render(e.getGuiGraphics());
                      e.setCanceled(true);
                  }

                  @SubscribeEvent
                  public static void onFov(ViewportEvent.ComputeFov e) {
                      if (CamState.active) e.setFOV(e.getFOV() / CamState.zoom);
                  }

                  // Movimento de camera na mao: inercia, respiracao, passos, pulo/queda
                  @SubscribeEvent
                  public static void onAngles(ViewportEvent.ComputeCameraAngles e) {
                      if (!CamState.active) { CamState.lagInit = false; CamState.lastNs = 0; return; }
                      Minecraft mc = Minecraft.getInstance();
                      Player p = mc.player;
                      if (p == null) return;

                      long nowNs = System.nanoTime();
                      double dt = CamState.lastNs == 0 ? 0.016 : Math.min(0.1, (nowNs - CamState.lastNs) / 1e9);
                      CamState.lastNs = nowNs;
                      double t = nowNs / 1e9;

                      float yaw = e.getYaw(), pitch = e.getPitch();
                      if (!CamState.lagInit) { CamState.lagYaw = yaw; CamState.lagPitch = pitch; CamState.lagInit = true; }

                      // inercia: a camera "atrasa" um pouco ao girar
                      double k = 1 - Math.exp(-dt * 9);
                      CamState.lagYaw += Mth.wrapDegrees(yaw - CamState.lagYaw) * k;
                      CamState.lagPitch += (pitch - CamState.lagPitch) * k;
                      float lagOffY = (float) Mth.clamp(Mth.wrapDegrees(CamState.lagYaw - yaw) * 0.7, -7, 7);
                      float lagOffP = (float) Mth.clamp((CamState.lagPitch - pitch) * 0.7, -7, 7);

                      // passos
                      Vec3 v = p.getDeltaMovement();
                      double sp = Math.sqrt(v.x * v.x + v.z * v.z);
                      float amp = (float) Math.min(1.5, sp / 0.1);
                      if (!p.isOnGround()) amp *= 0.3f;
                      double phase = p.walkDist * 2.4;
                      float bobP = (float) (Math.abs(Math.sin(phase)) * 1.2 * amp);
                      float bobY = (float) (Math.sin(phase) * 0.7 * amp);
                      float bobR = (float) (Math.cos(phase) * 1.0 * amp);

                      // tremor de mao e respiracao
                      float dY = (float) (Math.sin(t * 0.9) * 0.25 + Math.sin(t * 2.3 + 1.1) * 0.12);
                      float dP = (float) (Math.sin(t * 1.1 + 0.5) * 0.2 + Math.sin(t * 3.1) * 0.07 + Math.sin(t * 1.7) * 0.1);
                      float dR = (float) (Math.sin(t * 0.7 + 2.0) * 0.25);

                      CamState.jolt *= (float) Math.exp(-dt * 6);

                      e.setYaw(yaw + lagOffY + bobY + dY);
                      e.setPitch(pitch + lagOffP + bobP + dP + CamState.jolt);
                      e.setRoll(e.getRoll() + bobR + dR + lagOffY * 0.3f);
                  }
              }
          }
          VHSEOF
          mkdir -p src/main/java/dev/vhscam
          cat > src/main/java/dev/vhscam/VhsOverlay.java <<'VHSEOF'
          package dev.vhscam;

          import net.minecraft.client.Minecraft;
          import net.minecraft.client.gui.Font;
          import net.minecraft.client.gui.GuiGraphics;

          import java.time.LocalDateTime;
          import java.time.format.DateTimeFormatter;
          import java.util.Random;

          public class VhsOverlay {
              private static final Random RNG = new Random();
              private static final int WHITE = 0xFFE8E8F0;
              private static final DateTimeFormatter DATE = DateTimeFormatter.ofPattern("yyyy-MM-dd  HH:mm");

              public static void render(GuiGraphics g) {
                  Minecraft mc = Minecraft.getInstance();
                  int sw = mc.getWindow().getGuiScaledWidth();
                  int h = mc.getWindow().getGuiScaledHeight();
                  long now = System.curren
