name: Build VHS Viewfinder

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar arquivos do repositorio
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.8'

      - name: Compilar o mod original
        shell: bash
        run: |
          set -euo pipefail

          ZIP_FILE='vhscam-forge-1.20.1 (3).zip'
          if [ -f "$ZIP_FILE" ]; then
            mkdir -p source
            unzip -oq "$ZIP_FILE" -d source
            PROJECT_DIR='source/vhscam-forge'
          elif [ -f 'build.gradle' ]; then
            PROJECT_DIR='.'
          elif [ -f 'vhscam-forge/build.gradle' ]; then
            PROJECT_DIR='vhscam-forge'
          else
            echo 'Nao encontrei o build.gradle do projeto VHS Viewfinder.'
            echo 'Envie o ZIP vhscam-forge-1.20.1 (3).zip para a raiz do repositorio ou coloque os arquivos do projeto na raiz.'
            exit 1
          fi

          test -f "$PROJECT_DIR/build.gradle"
          gradle -p "$PROJECT_DIR" build --no-daemon
          echo "ARTIFACT_PATH=$PROJECT_DIR/build/libs/*.jar" >> "$GITHUB_ENV"

      - name: Disponibilizar arquivo JAR
        uses: actions/upload-artifact@v4
        with:
          name: VHS-Viewfinder-1.20.1
          path: ${{ env.ARTIFACT_PATH }}
          if-no-files-found: error
          
